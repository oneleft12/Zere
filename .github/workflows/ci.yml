name: CI

on:
  push:
  pull_request:

jobs:
  panel:
    name: Панель (typecheck + сборка)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Зависимости
        working-directory: panel
        run: npm ci

      - name: Typecheck и сборка
        working-directory: panel
        run: npm run build

      - name: dist в git совпадает с исходниками
        run: |
          if [ -n "$(git status --porcelain panel/dist)" ]; then
            echo "::error::panel/dist устарел — выполните npm run build в panel/ и закоммитьте"
            git status --porcelain panel/dist
            exit 1
          fi

  e2e:
    name: E2E-смок панели (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Зависимости панели
        working-directory: panel
        run: npm ci

      - name: Зависимости раннера (pyyaml)
        run: pip install pyyaml

      - name: Браузер Chromium с системными библиотеками
        working-directory: panel
        run: npx playwright install --with-deps chromium

      - name: Сборка панели
        working-directory: panel
        run: npm run build

      - name: E2E-смок (дашборд → чат → настройки → i18n)
        working-directory: panel
        run: npm run test:e2e

      - name: Артефакты при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: panel/test-results/
          retention-days: 7

  python:
    name: Python-порт
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Зависимости тестов и линтера
        # requirements-dev.txt — pytest, pytest-cov, PyYAML, requests, pillow,
        # psutil, ruff. Полный requirements.txt не ставим: ChatTTS тянет torch
        # (~2–3 ГБ), а тестам хватает фейков (tests/fake_*.py) и скипов по
        # отсутствующим тяжёлым пакетам.
        run: python -m pip install -r requirements-dev.txt

      - name: Линтер (ruff)
        # F — неопределённые имена и неиспользуемое, E9 — синтаксис,
        # B023 — замыкание над переменной цикла. Обоснование — ruff.toml.
        run: ruff check zere main.py tests

      - name: Компиляция
        run: python -m compileall -q zere main.py

      - name: Проверка порта (AST-контракт)
        run: python scripts/check_port.py

      - name: Все тесты с покрытием
        # Раньше файлы вызывались поимённо, и 13 файлов (конспектор, MCP,
        # ChatTTS, KWS…) не исполнялись вовсе — 294 теста из 753. Теперь
        # pytest гоняет весь набор, а --cov-fail-under не даёт покрытию
        # ядра тихо просесть.
        run: |
          python -m pytest tests -q \
            --cov=zere --cov-report=term-missing:skip-covered \
            --cov-fail-under=70

  csharp:
    name: C# (сборка + контракт панели)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Сборка решения
        run: dotnet build ZERE.slnx -v q

      - name: Python для контрактных тестов
        run: python -m pip install pyyaml requests

      - name: Контрактные тесты против C#-панели
        shell: bash
        env:
          # Очистка истории в тестах необратима: разрешаем её только здесь,
          # в CI рабочая копия одноразовая. Локально флаг не задаётся.
          ZERE_PANEL_DESTRUCTIVE: "1"
        run: |
          set -euo pipefail

          # Фейковый облачный провайдер: путь «ключ → проверка → чат»
          # проверяется без интернета и без настоящих API.
          python tests/fake_openai_server.py 8123 &
          FAKE_PID=$!

          dotnet run --project ZERE.App --no-build -- --panel &
          SERVER_PID=$!
          trap 'kill $SERVER_PID $FAKE_PID 2>/dev/null || true' EXIT

          # Полный цикл ИИ на фейковом провайдере (+ безопасные контракты /api/ai)
          python tests/check_ai_contract_external.py 8080 --full

          ZERE_PANEL_EXTERNAL=1 python tests/test_panel_api.py
