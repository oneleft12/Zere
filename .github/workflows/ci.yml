name: CI

on:
  push:
  pull_request:

jobs:
  panel:
    name: Панель (typecheck + сборка)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Зависимости
        working-directory: panel
        run: npm ci

      - name: Typecheck и сборка
        working-directory: panel
        run: npm run build

      - name: dist в git совпадает с исходниками
        run: |
          if [ -n "$(git status --porcelain panel/dist)" ]; then
            echo "::error::panel/dist устарел — выполните npm run build в panel/ и закоммитьте"
            git status --porcelain panel/dist
            exit 1
          fi

  e2e:
    name: E2E-смок панели (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Зависимости панели
        working-directory: panel
        run: npm ci

      - name: Зависимости раннера (pyyaml)
        run: pip install pyyaml

      - name: Браузер Chromium с системными библиотеками
        working-directory: panel
        run: npx playwright install --with-deps chromium

      - name: Сборка панели
        working-directory: panel
        run: npm run build

      - name: E2E-смок (дашборд → чат → настройки → i18n)
        working-directory: panel
        run: npm run test:e2e

      - name: Артефакты при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: panel/test-results/
          retention-days: 7

  python:
    name: Python-порт
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Зависимости тестов
        run: pip install pyyaml requests

      - name: Компиляция
        run: python -m compileall -q jarvis main.py

      - name: Проверка порта (AST-контракт)
        run: python scripts/check_port.py

      - name: Контрактные тесты панели (внутрипроцессная)
        run: python tests/test_panel_api.py

      - name: Тесты P1-2 (system-промпт один раз)
        run: python tests/test_system_prompt.py

      - name: Тесты рисования (Krita/Paint)
        run: python tests/test_drawing.py

  csharp:
    name: C# (сборка + контракт панели)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Сборка решения
        run: dotnet build JARVIS.slnx -v q

      - name: Python для контрактных тестов
        run: python -m pip install pyyaml requests

      - name: Контрактные тесты против C#-панели
        shell: bash
        env:
          # Очистка истории в тестах необратима: разрешаем её только здесь,
          # в CI рабочая копия одноразовая. Локально флаг не задаётся.
          JARVIS_PANEL_DESTRUCTIVE: "1"
        run: |
          set -euo pipefail
          dotnet run --project JARVIS.App --no-build -- --panel &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          JARVIS_PANEL_EXTERNAL=1 python tests/test_panel_api.py
