openapi: 3.0.3

info:
  title: ZERE Local Panel API
  description: >
    Единый API-контракт локальной панели ZERE для обеих реализаций
    (C# и Python). Этап 1 «API-ядро» (docs/GUI_DEVELOPMENT_PLAN.md §6).

    Правила контракта:
    - сервер слушает только 127.0.0.1 (loopback);
    - все запросы требуют заголовок `X-ZERE-Token`
      (токен лежит в `config/panel.token`, создаётся при первом старте);
    - заголовок `Host` должен быть `127.0.0.1` или `localhost`;
    - заголовок `Origin`, если присутствует, должен принадлежать
      тому же origin — иначе 403;
    - ошибки нормализованы: `{code, message}` без сырых исключений
      и внутренних путей.
  version: 1.0.0

servers:
  - url: http://127.0.0.1:8080
    description: Локальная панель (loopback only)

security:
  - tokenHeader: []

paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Статус сервисов ассистента
      tags: [system]
      responses:
        "200":
          description: Текущие статусы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/config:
    get:
      operationId: getConfig
      summary: Читаемая конфигурация (единая схема C#/Python)
      tags: [config]
      responses:
        "200":
          description: Текущая конфигурация
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: setConfig
      summary: Валидация и атомарное сохранение конфигурации
      tags: [config]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Config"
      responses:
        "200":
          description: Сохранённая конфигурация
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
        "400":
          description: >
            Ошибка валидации: неизвестный ключ или неверный тип значения.
            Тело — нормализованная ошибка.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/chat/stream:
    get:
      operationId: streamChat
      summary: Диалог с ассистентом потоком (SSE)
      description: >
        Односторонний поток ассистента: события `token` (фрагменты ответа),
        затем `done` с полным ответом, либо `error` с нормализованной
        ошибкой. Ответ формируется через штатный конвейер обработчиков
        (handlers pipeline), LLM — fallback.
      tags: [chat]
      parameters:
        - name: text
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 4000
          description: Реплика пользователя
      responses:
        "200":
          description: SSE-поток
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ChatEvent"
        "400":
          description: Пустой или слишком длинный текст
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/personality:
    get:
      operationId: getPersonality
      summary: Активная личность и фактический список стилей
      description: >
        Только фактические стили из API (этап 2: карточки стилей без
        хардкода — урок «6 стилей → 5» из отчёта анализа).
      tags: [personality]
      responses:
        "200":
          description: Текущая личность и стили
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Personality"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/NotReady"

  /api/personality/set:
    post:
      operationId: setPersonalityStyle
      summary: Смена стиля с сохранением (переживает рестарт — чинит P1-3)
      tags: [personality]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StyleSetRequest"
      responses:
        "200":
          description: Обновлённая личность
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Personality"
        "400":
          description: Неизвестный стиль, битое тело или неверный тип
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/NotReady"

  /api/history:
    get:
      operationId: getHistory
      summary: Страница истории диалогов (новые сверху)
      tags: [history]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
          description: >
            Регистронезависимая подстрока по вопросу и ответу;
            пусто — вся история.
      responses:
        "200":
          description: Страница истории и общее число записей
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryPage"
        "400":
          description: Некорректные limit/offset/search
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/NotReady"
    delete:
      operationId: clearHistory
      summary: Очистка истории — только с явным подтверждением
      description: >
        Необратимое действие: тело обязано быть {confirm: "DELETE"}
        (см. P0-3 — строгие подтверждения).
      tags: [history]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HistoryDeleteRequest"
      responses:
        "200":
          description: Число удалённых записей
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryDeleteResponse"
        "400":
          description: Нет подтверждения или неверное тело
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/NotReady"

  /api/memory:
    get:
      operationId: getMemory
      summary: Все записи памяти или поиск по ним
      tags: [memory]
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Подстрока для поиска по ключу и значению; пусто — все записи
      responses:
        "200":
          description: Записи памяти
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createMemory
      summary: Создать или обновить запись памяти (upsert по ключу)
      tags: [memory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryCreateRequest"
      responses:
        "200":
          description: Сохранённая запись
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryItem"
        "400":
          description: Некорректное тело записи
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/NotReady"

  /api/memory/{id}:
    delete:
      operationId: deleteMemory
      summary: Удалить запись памяти по идентификатору
      tags: [memory]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Запись удалена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryDeleteResponse"
        "400":
          description: Идентификатор не число
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Запись не найдена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/processes:
    get:
      operationId: listProcesses
      summary: Список процессов (подстрочный поиск по имени — параметр q)
      tags: [processes]
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Процессы, отсортированные по памяти (по убыванию)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessList"
        "400":
          description: Параметр q длиннее 100 символов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/NotReady"

  /api/processes/{pid}/kill:
    post:
      operationId: killProcess
      summary: >
        Завершить процесс. Шаг 1 (тело {}) — сервер выдаёт ttlToken на 60 с;
        шаг 2 — {confirm: "KILL", ttlToken}. TTL проверяется на сервере,
        защищённые системные процессы не завершаются (400 PROTECTED).
      tags: [processes]
      parameters:
        - name: pid
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  maxProperties: 0
                  description: Шаг 1 — запрос одноразового токена подтверждения
                - $ref: "#/components/schemas/KillConfirm"
      responses:
        "200":
          description: >
            pending (status, pid, name, ttlToken, expiresInSeconds) на шаге 1
            или killed (status, pid, name) на шаге 2
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/KillPending"
                  - $ref: "#/components/schemas/KillResult"
        "400":
          description: >
            VALIDATION_ERROR (тело/подтверждение), PROTECTED (системный
            процесс) или TTL_EXPIRED (токен истёк, погашен или от чужого действия)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Маршрут не найден или процесс уже завершён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/NotReady"

  /api/power/{action}:
    post:
      operationId: requestPower
      summary: >
        Питание (shutdown/restart/sleep). Шаг 1 (тело {}) — действие ставится
        в очередь SafeActionManager и выдаётся ttlToken; шаг 2 —
        {confirm: "POWER", ttlToken}: двойной TTL (панель + SafeActionManager)
      tags: [processes]
      parameters:
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [shutdown, restart, sleep]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  maxProperties: 0
                  description: Шаг 1 — запрос одноразового токена подтверждения
                - $ref: "#/components/schemas/PowerConfirm"
      responses:
        "200":
          description: pending (status, action, ttlToken, expiresInSeconds) или итог executed/failed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PowerPending"
                  - $ref: "#/components/schemas/PowerResult"
        "400":
          description: VALIDATION_ERROR (тело/подтверждение) или TTL_EXPIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Неизвестное действие питания
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/NotReady"

  /api/apps:
    get:
      operationId: listApps
      summary: >
        Индексированные приложения. Подстрочный поиск по имени и алиасам
        без учёта регистра (параметр q), сортировка по priority ↓, затем
        по имени (Ordinal)
      tags: [apps]
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: Список приложений и его размер после фильтрации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppList"
        "400":
          description: Параметр q длиннее 200 символов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Метод не поддерживается (маршрут принимает только GET)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: Метод не поддерживается
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/NotReady"

  /api/apps/reindex:
    post:
      operationId: reindexApps
      summary: >
        Полная переиндексация установленных приложений (сканеры реестра,
        меню «Пуск», AppPaths, LocalAppData). Тело запроса не читается.
      tags: [apps]
      responses:
        "200":
          description: Размер индекса и длительность пересборки, мс
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppReindexResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Метод не поддерживается этим маршрутом
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: Метод не поддерживается
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/NotReady"

  /api/logs:
    get:
      operationId: listLogs
      summary: >
        Журнал: сессионные файлы logs/zere_*.log и постоянный errors.log.
        Источник (source) есть только у строк errors.log — по имени файла,
        а не по разбору строки. Сортировка по времени DESC, пагинация
        как в истории (limit/offset)
      tags: [logs]
      parameters:
        - name: level
          in: query
          required: false
          description: Фильтр по уровню; без параметра — все уровни
          schema:
            type: string
            enum: [info, warn, error]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Строки журнала (новые сверху) и общий размер после фильтра
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogList"
        "400":
          description: Некорректные limit/offset или неизвестный level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Метод не поддерживается (маршрут принимает только GET)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: Метод не поддерживается
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/plugins:
    get:
      operationId: listPlugins
      summary: >
        Инвентарь загруженных плагинов и активная личность. Флага enabled
        нет (его не хранит PluginManager); handlersConnected отражает
        фактическое состояние конвейера — подключён ли в него мост к
        плагинам-обработчикам
      tags: [plugins]
      responses:
        "200":
          description: Список плагинов и активная личность (null — если не задана)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Метод не поддерживается (маршрут принимает только GET)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: Метод не поддерживается
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/voice:
    get:
      operationId: getVoice
      summary: Голосовые настройки из конфигурации + возможности реализации
      tags: [voice]
      responses:
        "200":
          description: Настройки голоса и capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Метод не поддерживается
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/NotReady"
    post:
      operationId: updateVoice
      summary: >
        Обновление любого непустого подмножества голосовых полей.
        voiceVolume и audioProcessing применяются сразу (liveVolumeApply /
        DSP читается на каждое предложение); voiceEnabled, ttsEngine и
        voiceReferencePath — после рестарта: appliedOnRestart становится
        true, если одно из них изменилось
      tags: [voice]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceUpdate"
      responses:
        "200":
          description: Сохранённые настройки и признак отложенного применения
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceSettingsApplied"
        "400":
          description: Некорректное тело или неизвестный/неверный ключ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Метод не поддерживается
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/NotReady"

  /api/voice/mode:
    get:
      operationId: getVoiceMode
      summary: >
        Состояние непрерывного голосового режима (фоновый цикл
        wake word → команда → ответ → озвучка): enabled/state/available,
        последняя реплика диалога и счётчик реплик turn (по нему панель
        добавляет голосовой обмен в диалог чата)
      tags: [voice]
      responses:
        "200":
          description: Текущее состояние голосового режима
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceModeState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Метод не поддерживается
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/NotReady"
    post:
      operationId: setVoiceMode
      summary: >
        Включение/выключение непрерывного голосового режима. Включение
        поднимает фоновый поток: слушает микрофон (со словом-триггером,
        если wake word включён в конфиге), распознаёт команду, прогоняет
        её через engine и озвучивает ответ; выключение останавливает
        цикл и освобождает микрофон. Повторное включение идемпотентно
      tags: [voice]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceModeUpdate"
      responses:
        "200":
          description: Состояние после применения запроса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceModeState"
        "400":
          description: "Некорректное тело: enabled отсутствует, не boolean или лишний ключ"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Метод не поддерживается
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          description: >
            Голосовой модуль не готов или распознавание речи недоступно
            (available=false) — режим включить нельзя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/voice/reference:
    post:
      operationId: recordVoiceReference
      summary: >
        Запись WAV-референса голоса для клонирования и сохранение пути в
        конфигурации. C# записывает реально (capabilities.recordReference
        всегда true); Python-порт не умеет — стабильно 503 NOT_READY
        (recordReference:false)
      tags: [voice]
      responses:
        "200":
          description: Путь к записанному референсу
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceReferenceResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Метод не поддерживается
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          description: >
            Голосовой модуль не готов, реализация не записывает референс
            или запись не удалась (нет микрофона)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/voice/test:
    post:
      operationId: testVoice
      summary: >
        Синтез фразы через активный TTS-движок; 503 NOT_READY, если TTS
        не инициализирован (в режиме --panel CI — всегда)
      tags: [voice]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceTest"
      responses:
        "200":
          description: Фраза озвучена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceTestResult"
        "400":
          description: text отсутствует, не строка, пуст или длиннее 500
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Метод не поддерживается
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/NotReady"

  /api/voice/listen:
    post:
      operationId: listenVoice
      summary: >
        Тест STT: распознавание одной фразы с микрофона; 503 NOT_READY,
        если Whisper не установлен
      tags: [voice]
      responses:
        "200":
          description: Распознанный текст
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceListenResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Метод не поддерживается
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/NotReady"

  /api/update:
    get:
      operationId: getUpdateStatus
      summary: >
        Статус обновления из GitHub из кэша сервиса: сеть не трогается,
        отдаётся результат автопроверки при старте или последнего
        POST /api/update/check. Показывает ветку, локальный и удалённый
        HEAD, число коммитов позади/впереди, незакоммиченные правки
        и причину, по которой обновление недоступно
      tags: [update]
      responses:
        "200":
          description: Состояние обновления
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Метод не поддерживается
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/update/check:
    post:
      operationId: checkUpdate
      summary: >
        Проверка обновлений: git fetch текущей ветки и сравнение локального
        HEAD с refs/remotes/origin/<ветка>. Единственный сетевой вызов
        обновления, запускается и автоматически при старте панели. Тело
        запроса не читается; сбой сети не ошибка запроса — причина в поле
        error
      tags: [update]
      responses:
        "200":
          description: Свежее состояние обновления
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Метод не поддерживается
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/UpdateBusy"

  /api/update/apply:
    post:
      operationId: applyUpdate
      summary: >
        Применение обновления: `git pull --ff-only` текущей ветки, затем
        `pip install -r requirements.txt`, если файл изменился. Правки в
        рабочей копии и расхождение веток не трогаются — приходят в ответе
        как `ok: false` с причиной. После успешного pull нужен перезапуск
        ZERE
      tags: [update]
      requestBody:
        required: false
        description: 'Пустое тело равнозначно {"installDependencies": true}'
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApplyRequest"
      responses:
        "200":
          description: Результат применения (ok=false — отказ с причиной)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateOutcome"
        "400":
          description: Тело запроса не прошло валидацию
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Метод не поддерживается
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/UpdateBusy"

  /api/ai:
    get:
      operationId: getAiStatus
      summary: >
        Состояние подключения ИИ: облачный ключ пользователя или локальная
        модель. Ключ наружу не выходит — только маска вида `sk-...abcd`
        (требование безопасности). `activeProvider` = cloud, если ключ есть
        и рабочий, local — если доступна локальная модель, none — если нет
        ни того, ни другого
      tags: [ai]
      responses:
        "200":
          description: Текущее состояние подключения ИИ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/ai/settings:
    post:
      operationId: updateAiSettings
      summary: >
        Режим выбора провайдера (`auto` — сначала ключ, потом локальная
        модель; `cloud` — только ключ; `local` — только локальная модель),
        адреса и модели. API-ключ здесь не меняется — для него
        `/api/ai/key`
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiSettingsUpdate"
      responses:
        "200":
          description: Настройки применены и сохранены в config/ai.json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatus"
        "400":
          description: Тело запроса не прошло валидацию
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/ai/key:
    post:
      operationId: saveAiKey
      summary: >
        Проверка ключа рабочим запросом к API (`GET /models`, при
        необходимости минимальный `POST /chat/completions`) и сохранение.
        Нерабочий ключ не сохраняется: ответ 400 с кодом AI_KEY_INVALID,
        AI_NO_CREDITS, AI_RATE_LIMIT или AI_MODEL_UNAVAILABLE
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiKeyRequest"
      responses:
        "200":
          description: Ключ проверен и сохранён (в ответе только маска)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatus"
        "400":
          description: >
            Ключ не прошёл проверку или тело запроса некорректно
            (код в поле code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: Провайдер сообщил о превышении лимита запросов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteAiKey
      summary: >
        Удаление ключа пользователя (config/ai.json). Ключ владельца из
        переменных окружения сервера не удаляется — он принадлежит только
        аккаунту владельца
      tags: [ai]
      responses:
        "200":
          description: Ключ удалён, состояние ИИ пересчитано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/ai/key/test:
    post:
      operationId: testAiKey
      summary: >
        Кнопка «Проверить ключ»: рабочий запрос к API без сохранения.
        Если `apiKey` не передан, проверяется сохранённый ключ
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiKeyTestRequest"
      responses:
        "200":
          description: Ключ рабочий
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiKeyTestResult"
        "400":
          description: Ключ не рабочий или тело запроса некорректно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: Провайдер сообщил о превышении лимита запросов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/ai/local:
    get:
      operationId: getAiLocalStatus
      summary: >
        Проверка локальной модели: запущен ли сервер (Ollama или другой
        OpenAI-совместимый), какие модели доступны, загружена ли нужная,
        и инструкция по установке (`installHint`), если её нет
      tags: [ai]
      responses:
        "200":
          description: Состояние локальной модели
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiLocalStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/ai/local/test:
    post:
      operationId: testAiLocal
      summary: >
        Тестовый запрос к локальной модели (минимальная генерация).
        Ошибки: AI_LOCAL_SERVER_DOWN, AI_LOCAL_MODEL_MISSING,
        AI_MODEL_UNAVAILABLE
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiLocalTestRequest"
      responses:
        "200":
          description: Локальная модель отвечает
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiLocalTestResult"
        "400":
          description: Сервер не запущен или модель не загружена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/ai/local/pull:
    get:
      operationId: pullAiLocalModel
      summary: >
        Загрузка локальной модели через Ollama (`POST /api/pull`) с
        потоком прогресса (SSE). Для не-Ollama локальных серверов приходит
        событие `error` с кодом AI_PULL_UNSUPPORTED — модель нужно
        загрузить средствами самого сервера
      tags: [ai]
      parameters:
        - name: model
          in: query
          required: false
          description: Имя модели (по умолчанию — модель из настроек)
          schema:
            type: string
      responses:
        "200":
          description: Поток событий прогресса (SSE)
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/AiPullEvent"
        "400":
          description: Недопустимое имя модели
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    tokenHeader:
      type: apiKey
      in: header
      name: X-ZERE-Token
      description: >
        Токен панели, 32 байта в hex, создаётся при первом старте
        и сохраняется в `config/panel.token`.

  responses:
    Unauthorized:
      description: Отсутствует или неверен X-ZERE-Token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Недопустимый Host или Origin (защита от DNS-rebinding/CSRF)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotReady:
      description: >
        Хранилище (личности, история, память), настройки или сервис
        (процессы, питание) ещё не готовы
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    UpdateBusy:
      description: >
        Проверка или применение обновления уже выполняется — повторный
        запрос отклонён (код UPDATE_BUSY)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          description: Машиночитаемый код (UNAUTHORIZED, FORBIDDEN_HOST, ...)
        message:
          type: string
          description: Понятное сообщение без сырых исключений и путей

    Health:
      type: object
      required: [ollama, whisper, tts, memory, version, branch]
      additionalProperties: false
      properties:
        ollama:
          type: string
          enum: [ok, down]
        whisper:
          type: string
          enum: [ok, missing]
        tts:
          type: object
          required: [engine, status]
          additionalProperties: false
          properties:
            engine:
              type: string
              enum: [pocket, chattts, silero]
            status:
              type: string
              enum: [configured]
              description: >
                Этап 1: движок из конфигурации. Прямой пробинг TTS-сервера
                появится позже (этап 4).
        memory:
          type: object
          required: [count]
          additionalProperties: false
          properties:
            count:
              type: integer
              minimum: 0
        version:
          type: string
        branch:
          type: string
          description: Ветка git (из .git/HEAD) или "unknown"

    Config:
      type: object
      required:
        - version
        - assistantName
        - language
        - model
        - voiceEnabled
        - voiceVolume
        - autoMemory
        - ollamaTimeoutMinutes
        - ttsEngine
        - voiceReferencePath
        - llmKeepAlive
        - llmMaxTokens
        - llmTimeoutSeconds
      additionalProperties: false
      properties:
        version:
          type: string
        assistantName:
          type: string
        language:
          type: string
          enum: [ru, en]
        model:
          type: string
          description: Имя модели Ollama (например t-tech/T-lite-it-2.1:q4_K_M)
        voiceEnabled:
          type: boolean
        voiceVolume:
          type: number
          minimum: 0
          maximum: 1
        autoMemory:
          type: boolean
        ollamaTimeoutMinutes:
          type: integer
          minimum: 1
          maximum: 120
        ttsEngine:
          type: string
          enum: [pocket, chattts, silero]
        sttEngine:
          type: string
          enum: [gigaam, whisper]
          description: >-
            Движок распознавания речи: gigaam — GigaAM-v3 (основной),
            whisper — откат (отчёт docs/STT_ENGINE_RESEARCH.md).
            Необязательный ключ: старые клиенты могут его не присылать.
        voiceReferencePath:
          type: string
          description: Путь к WAV-референсу голоса, пусто = встроенный голос
        audioProcessing:
          type: boolean
          description: >-
            DSP-обработка озвучки ChatTTS (EQ, мягкая компрессия,
            нормализация); false — «сырой» выход TTS. Необязательный ключ:
            старые клиенты могут его не присылать.
        llmKeepAlive:
          type: integer
          minimum: -1
          maximum: 86400
          description: >-
            keep_alive модели Ollama в секундах (-1 — держать в памяти
            бессрочно, 0 — выгрузить сразу). Ускоряет следующий запрос,
            пока модель не выгружена.
        llmMaxTokens:
          type: integer
          minimum: 16
          maximum: 4096
          description: >-
            Лимит ответа LLM в токенах в голосовом режиме
            (текстовый режим лимит не применяется).
        llmTimeoutSeconds:
          type: integer
          minimum: 5
          maximum: 600
          description: Таймаут запроса к Ollama в секундах (для голоса — 60).
        wakeEngine:
          type: string
          enum: [auto, kws, whisper]
          description: >-
            Движок слова-триггера: auto — стриминговый KWS на своей ONNX-модели,
            если она есть, иначе прежний детектор на VAD + STT; kws — только KWS;
            whisper — прежний детектор (docs/WAKE_WORD.md). Необязательный ключ:
            старые клиенты могут его не присылать.
        wakeModelPath:
          type: string
          description: >-
            Явный путь к ONNX-модели wake word (пусто — папка моделей по
            слову-триггеру: ZERE.Voice/WakeWord/models/wake_<слово>.onnx)
        wakeThreshold:
          type: number
          minimum: 0
          maximum: 1
          description: Порог вероятности (0 — значение из манифеста модели)
        wakeMinConsecutive:
          type: integer
          minimum: 0
          description: >-
            Сколько кадров подряд с вероятностью ≥ порога нужно для
            срабатывания (0 — значение из манифеста модели)
        wakeCooldownMs:
          type: integer
          minimum: 0
          description: >-
            Пауза после срабатывания в мс (0 — значение из манифеста модели)
        wakeEnergyGate:
          type: boolean
          description: >-
            Отсечка тишины по энергии: пока RMS последних 300 мс ниже порога,
            модель не запускается (в тихой комнате — ноль работы)

    Personality:
      type: object
      required: [activeId, activeStyle, styles]
      additionalProperties: false
      properties:
        activeId:
          type: string
          description: Идентификатор активного плагина личности
        activeStyle:
          type: string
          description: Текущий стиль (например Friendly)
        styles:
          type: array
          description: Фактический список доступных стилей (без хардкода)
          items:
            type: string

    StyleSetRequest:
      type: object
      required: [styleId]
      additionalProperties: false
      properties:
        styleId:
          type: string
          description: Идентификатор стиля из Personality.styles

    HistoryPage:
      type: object
      required: [items, total]
      additionalProperties: false
      properties:
        items:
          type: array
          description: Страница истории, новые сверху
          items:
            $ref: "#/components/schemas/HistoryItem"
        total:
          type: integer
          minimum: 0
          description: Всего записей (для пагинации)

    HistoryItem:
      type: object
      required: [id, userMessage, zereResponse, timestamp]
      additionalProperties: false
      properties:
        id:
          type: integer
        userMessage:
          type: string
        zereResponse:
          type: string
        timestamp:
          type: string
          format: date-time

    HistoryDeleteRequest:
      type: object
      required: [confirm]
      additionalProperties: false
      properties:
        confirm:
          type: string
          enum: [DELETE]

    HistoryDeleteResponse:
      type: object
      required: [deleted]
      additionalProperties: false
      properties:
        deleted:
          type: integer
          minimum: 0
          description: Число удалённых записей

    MemoryList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MemoryItem"

    MemoryItem:
      type: object
      required: [id, key, value, category, createdAt]
      additionalProperties: false
      properties:
        id:
          type: integer
        key:
          type: string
        value:
          type: string
        category:
          type: string
        createdAt:
          type: string
          format: date-time

    MemoryCreateRequest:
      type: object
      required: [key, value]
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 200
        value:
          type: string
          maxLength: 2000
        category:
          type: string
          minLength: 1
          maxLength: 100
          description: По умолчанию "User"

    MemoryDeleteResponse:
      type: object
      required: [deleted]
      additionalProperties: false
      properties:
        deleted:
          type: boolean

    ProcessInfo:
      type: object
      required: [pid, name, memoryMb, responding, protected]
      additionalProperties: false
      properties:
        pid:
          type: integer
          format: int32
          minimum: 1
        name:
          type: string
        memoryMb:
          type: number
          description: Используемая память, МБ (округление сервиса процессов)
        responding:
          type: boolean
        protected:
          type: boolean
          description: Системный процесс — завершение запрещено (400 PROTECTED)
      # CPU намеренно не отдаётся: ни C#, ни Python-сервис процессов его
      # не измеряют — панель не показывает данные, которых нет.

    ProcessList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProcessInfo"

    KillConfirm:
      type: object
      required: [confirm, ttlToken]
      additionalProperties: false
      properties:
        confirm:
          type: string
          enum: [KILL]
        ttlToken:
          type: string
          pattern: "^[0-9a-f]{32}$"
          description: Токен, выданный шагом 1; одноразовый, срок 60 с

    KillPending:
      type: object
      required: [status, pid, name, ttlToken, expiresInSeconds]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [pending]
        pid:
          type: integer
          format: int32
        name:
          type: string
        ttlToken:
          type: string
          pattern: "^[0-9a-f]{32}$"
        expiresInSeconds:
          type: integer
          enum: [60]

    KillResult:
      type: object
      required: [status, pid, name]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [killed]
        pid:
          type: integer
          format: int32
        name:
          type: string

    PowerConfirm:
      type: object
      required: [confirm, ttlToken]
      additionalProperties: false
      properties:
        confirm:
          type: string
          enum: [POWER]
        ttlToken:
          type: string
          pattern: "^[0-9a-f]{32}$"

    PowerPending:
      type: object
      required: [status, action, ttlToken, expiresInSeconds]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [pending]
        action:
          type: string
          enum: [shutdown, restart, sleep]
        ttlToken:
          type: string
          pattern: "^[0-9a-f]{32}$"
        expiresInSeconds:
          type: integer
          enum: [60]

    PowerResult:
      type: object
      required: [status, action]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [executed, failed]
        action:
          type: string
          enum: [shutdown, restart, sleep]

    AppInfo:
      type: object
      required: [name, executablePath, source, category, priority, aliases, lastSeen]
      additionalProperties: false
      properties:
        name:
          type: string
        executablePath:
          type: string
        source:
          type: string
          description: Сканер-источник (Registry / StartMenu / AppPaths / LocalAppData)
        category:
          type: string
        priority:
          type: integer
          description: Вес канала индексации (выше — выше в списке)
        aliases:
          type: array
          items:
            type: string
        lastSeen:
          type: string
          format: date-time

    AppList:
      type: object
      required: [items, total]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AppInfo"
        total:
          type: integer
          description: Количество после фильтра q (без q — весь индекс)

    AppReindexResponse:
      type: object
      required: [count, durationMs]
      additionalProperties: false
      properties:
        count:
          type: integer
        durationMs:
          type: integer

    LogEntry:
      type: object
      required: [time, level, message, source]
      additionalProperties: false
      properties:
        time:
          type: string
          format: date-time
          description: Метка времени журнала в нормализованном виде
        level:
          type: string
          enum: [info, warn, error]
        message:
          type: string
        source:
          type: string
          nullable: true
          description: Источник из errors.log; null для сессионных файлов

    LogList:
      type: object
      required: [items, total]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LogEntry"
        total:
          type: integer
          description: Размер журнала после фильтра level (до пагинации)

    Plugin:
      type: object
      required: [id, name, description, version, author, type]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: string
        author:
          type: string
        type:
          type: string
          enum: [Personality, CommandHandler, MemoryProvider, VoiceEngine, Other]

    PluginList:
      type: object
      required: [items, handlersConnected, commandHandlersCount, activePersonality]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Plugin"
        handlersConnected:
          type: boolean
          description: >
            Подключён ли к конвейеру мост к плагинам-обработчикам. Раньше
            было всегда false (плагины грузились, но команд не получали);
            теперь отражает фактическое состояние сборки
        commandHandlersCount:
          type: integer
        activePersonality:
          type: object
          nullable: true
          required: [id, style]
          additionalProperties: false
          properties:
            id:
              type: string
            style:
              type: string
              description: Активный стиль (Friendly, Formal, …)

    VoiceCapabilities:
      type: object
      description: >
        Фактические возможности голосовой подсистемы текущей реализации.
        C# и Python различаются честно (см. descriptions полей).
      required: [recordReference, pocketCloning, speechSpeedConfig, liveVolumeApply, sttTest]
      additionalProperties: false
      properties:
        recordReference:
          type: boolean
          description: C# записывает WAV-референс; Python-порт нет (POST → 503)
        pocketCloning:
          type: boolean
          description: PocketTTS-клонирование есть только в C#-версии
        speechSpeedConfig:
          type: boolean
          description: >
            speechSpeed передаётся в движок: ChatTTS получает темп токеном
            [speed_N] (1.15 → 4) на каждый запрос, перезапуск не нужен
        liveVolumeApply:
          type: boolean
          description: Громкость читается на каждое воспроизведение (обе реализации)
        sttTest:
          type: boolean
          description: STT сейчас доступен (модель Whisper установлена)

    VoiceSettings:
      type: object
      required:
        - voiceEnabled
        - voiceVolume
        - ttsEngine
        - voiceReferencePath
        - audioProcessing
        - capabilities
      additionalProperties: false
      properties:
        voiceEnabled:
          type: boolean
        voiceVolume:
          type: number
          minimum: 0
          maximum: 1
        ttsEngine:
          type: string
          enum: [pocket, chattts, silero]
        voiceReferencePath:
          type: string
        audioProcessing:
          type: boolean
          description: >
            DSP-обработка озвучки ChatTTS (EQ, мягкая компрессия, нормализация).
            Читается на каждое предложение — переключается без перезапуска;
            false — «сырой» выход TTS
        capabilities:
          $ref: "#/components/schemas/VoiceCapabilities"

    VoiceSettingsApplied:
      type: object
      required:
        - voiceEnabled
        - voiceVolume
        - ttsEngine
        - voiceReferencePath
        - audioProcessing
        - appliedOnRestart
      additionalProperties: false
      properties:
        voiceEnabled:
          type: boolean
        voiceVolume:
          type: number
          minimum: 0
          maximum: 1
        ttsEngine:
          type: string
          enum: [pocket, chattts, silero]
        voiceReferencePath:
          type: string
        audioProcessing:
          type: boolean
          description: >
            DSP-обработка озвучки: применяется сразу (на следующее
            предложение), на appliedOnRestart не влияет
        appliedOnRestart:
          type: boolean
          description: >
            true, если изменилось voiceEnabled/ttsEngine/voiceReferencePath
            (громкость и audioProcessing применяются сразу и на флаг не влияют)

    VoiceUpdate:
      type: object
      description: Любое непустое подмножество голосовых полей; посторонние ключи — 400
      minProperties: 1
      additionalProperties: false
      properties:
        voiceEnabled:
          type: boolean
        voiceVolume:
          type: number
          minimum: 0
          maximum: 1
        ttsEngine:
          type: string
          enum: [pocket, chattts, silero]
        voiceReferencePath:
          type: string
        audioProcessing:
          type: boolean

    VoiceModeState:
      type: object
      description: >
        Состояние непрерывного голосового режима. state — фактическая
        фаза фонового цикла; lastUtterance/lastAnswer — последняя
        голосовая реплика и ответ на неё ("" — ещё не было);
        turn — счётчик обработанных реплик: по его росту клиент понимает,
        что в диалог нужно дописать новую пару
      required:
        - enabled
        - state
        - available
        - wakeWordEnabled
        - wakeWord
        - lastUtterance
        - lastAnswer
        - lastError
        - turn
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: Фоновый цикл запущен (включён через POST)
        state:
          type: string
          enum: [idle, sleeping, listening, processing, speaking, error]
          description: >
            idle — выключен; sleeping — ждёт wake word; listening — слушает
            команду; processing — генерируется ответ; speaking — озвучивается;
            error — цикл остановился с ошибкой (lastError)
        available:
          type: boolean
          description: STT готов — режим можно включить (иначе POST → 503)
        wakeWordEnabled:
          type: boolean
          description: Wake word включён в конфиге (иначе слушает без триггера)
        wakeWord:
          type: string
          description: Ключевое слово-триггер (например «джарвис»)
        wakeEngine:
          type: string
          description: >
            Движок слова-триггера: onnx-kws — стриминговый keyword spotting
            на своей ONNX-модели (docs/WAKE_WORD.md); whisper — прежний
            детектор (энергетический VAD + полный STT + сравнение строк)
        lastUtterance:
          type: string
          description: Последняя распознанная голосовая команда
        lastAnswer:
          type: string
          description: Последний ответ ассистента на голосовую команду
        lastError:
          type: string
          nullable: true
          description: Текст последней ошибки цикла, null — ошибок не было
        turn:
          type: integer
          minimum: 0
          description: >
            Счётчик обработанных голосовых реплик за жизнь процесса: после
            каждой реплики +1. По нему панель дописывает пару
            «услышано / ответ» в диалог чата — голосовая реплика идёт мимо
            `/api/chat/stream`, и без счётчика её в чате не видно. Никогда
            не сбрасывается (в том числе при повторном включении режима)

    VoiceModeUpdate:
      type: object
      description: Включение/выключение непрерывного голосового режима
      required: [enabled]
      additionalProperties: false
      properties:
        enabled:
          type: boolean

    VoiceReferenceResult:
      type: object
      required: [voiceReferencePath]
      additionalProperties: false
      properties:
        voiceReferencePath:
          type: string

    VoiceTest:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500

    VoiceTestResult:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]

    VoiceListenResult:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text:
          type: string

    UpdateCommit:
      type: object
      required: [hash, short, subject, author, date]
      additionalProperties: false
      properties:
        hash:
          type: string
          description: Полный SHA-1 коммита
        short:
          type: string
          description: Короткий SHA-1 (как в `git log --oneline`)
        subject:
          type: string
          description: Первая строка сообщения коммита
        author:
          type: string
          description: Имя автора коммита
        date:
          type: string
          format: date-time
          description: Дата автора в ISO 8601 (git %aI)

    UpdateApplyRequest:
      type: object
      additionalProperties: false
      description: Тело POST /api/update/apply (необязательное)
      properties:
        installDependencies:
          type: boolean
          default: true
          description: >
            Обновлять зависимости Python (`pip install -r requirements.txt`),
            если файл изменился в подтянутых коммитах

    UpdateOutcome:
      type: object
      required:
        [ok, message, fromHash, toHash, pulled, dependencies, restartRequired, finishedAt]
      additionalProperties: false
      properties:
        ok:
          type: boolean
          description: >
            true — обновление применено; false — отказ с причиной в message
            (нет обновлений, незакоммиченные правки, расхождение веток, сбой git)
        message:
          type: string
        fromHash:
          type: string
          nullable: true
          description: Коммит HEAD до обновления
        toHash:
          type: string
          nullable: true
          description: Коммит HEAD после операции
        pulled:
          type: integer
          minimum: 0
          description: Сколько коммитов подтянуто
        dependencies:
          type: string
          enum: [not-needed, updated, skipped, failed]
          description: >
            not-needed — requirements.txt не менялся; updated — pip прошёл;
            skipped — pip отключён запросом; failed — pip не удался
        restartRequired:
          type: boolean
          description: true — код на диске новее запущенного, нужен перезапуск ZERE
        finishedAt:
          type: string
          format: date-time

    UpdateStatus:
      type: object
      required:
        [edition, available, branch, remote, remoteUrl, current, target, behind,
         ahead, commits, dirty, updateAvailable, canUpdate, blockedReason,
         checking, applying, checkedAt, error, lastResult]
      additionalProperties: false
      properties:
        edition:
          type: string
          enum: [python]
          description: Обновляется только Python-редакция (C#-хелпер озвучки не трогается)
        available:
          type: boolean
          description: Каталог — git-репозиторий и git доступен
        branch:
          type: string
        remote:
          type: string
          description: Имя удалённого репозитория (обычно origin)
        remoteUrl:
          type: string
          nullable: true
          description: URL без логина/токена
        current:
          allOf:
            - $ref: "#/components/schemas/UpdateCommit"
          nullable: true
          description: Локальный HEAD
        target:
          allOf:
            - $ref: "#/components/schemas/UpdateCommit"
          nullable: true
          description: HEAD удалённой ветки (refs/remotes/<remote>/<branch>)
        behind:
          type: integer
          minimum: 0
          description: Сколько коммитов есть на удалённой ветке и нет локально
        ahead:
          type: integer
          minimum: 0
          description: Сколько локальных коммитов нет на удалённой ветке
        commits:
          type: array
          description: Новые коммиты удалённой ветки (не более 30), новые сверху
          items:
            $ref: "#/components/schemas/UpdateCommit"
        dirty:
          type: boolean
          description: Есть незакоммиченные правки отслеживаемых файлов
        updateAvailable:
          type: boolean
        canUpdate:
          type: boolean
          description: Обновление можно применить прямо сейчас (fast-forward)
        blockedReason:
          type: string
          nullable: true
          description: Почему canUpdate = false (человекочитаемо)
        checking:
          type: boolean
        applying:
          type: boolean
        checkedAt:
          type: string
          format: date-time
          nullable: true
          description: Когда состояние собиралось последний раз
        error:
          type: string
          nullable: true
          description: Ошибка последней проверки (нет сети, нет git) — не 500
        lastResult:
          allOf:
            - $ref: "#/components/schemas/UpdateOutcome"
          nullable: true
          description: Результат последнего применения обновления

    ChatEvent:
      description: >
        SSE-события: `event: token` c `{"text": "..."}` (может повторяться),
        `event: done` c `{"answer": "..."}` (финал), `event: error`
        c объектом Error (нормализованная ошибка, поток завершается).
      oneOf:
        - type: object
          required: [event, data]
          properties:
            event:
              type: string
              enum: [token, done, error]
            data:
              type: object

    # ── ИИ: облачный ключ / локальная модель (docs/AI_PROVIDERS.md) ──
    AiProviderPreset:
      type: object
      additionalProperties: false
      description: Готовый пресет OpenAI-совместимого облачного API
      required: [id, label, baseUrl, model, docsUrl]
      properties:
        id:
          type: string
          enum: [openai, deepseek, openrouter, groq, opencode-go, custom]
        label:
          type: string
        baseUrl:
          type: string
        model:
          type: string
        docsUrl:
          type: string
          description: Где взять ключ (пусто у пресета «custom»)

    AiLocalModelOption:
      type: object
      additionalProperties: false
      description: >
        Локальная модель для слабых ПК. Первым идёт русско-ориентированный
        вариант (русский — обязательное требование ZERE), дальше — по объёму
        памяти; тяжёлые модели не предлагаются
      required: [id, label, tier, sizeHint]
      properties:
        id:
          type: string
        label:
          type: string
        tier:
          type: string
          enum: [tiny, light, medium]
        sizeHint:
          type: string

    AiInstallHint:
      type: object
      additionalProperties: false
      description: >
        Инструкция по установке локальной модели: показывается, когда
        сервер не запущен или нужная модель не загружена
      required: [title, steps, command, downloadUrl, model]
      properties:
        title:
          type: string
        steps:
          type: array
          minItems: 1
          items:
            type: string
        command:
          type: string
          description: Команда загрузки, например ollama pull t-tech/T-lite-it-2.1:q4_K_M
        downloadUrl:
          type: string
        model:
          type: string

    AiCloudStatus:
      type: object
      additionalProperties: false
      description: >
        Состояние облачного ключа. Секрет не отдаётся: только маска,
        источник ключа (пользователь/владелец) и результат проверки
      required: [provider, baseUrl, model, keySaved, keySource, keyMask, keyStatus, keyCheckedAt]
      properties:
        provider:
          type: string
          enum: [openai, deepseek, openrouter, groq, opencode-go, custom]
        baseUrl:
          type: string
        model:
          type: string
        keySaved:
          type: boolean
          description: Ключ есть (свой или владельца) и будет использован
        keySource:
          type: string
          enum: [none, user, owner]
        keyMask:
          type: string
          description: Маска вида sk-...abcd (пусто, если ключа нет)
        keyStatus:
          type: string
          enum: [unknown, ok, invalid]
        keyCheckedAt:
          type: string
          format: date-time
          nullable: true
          description: Когда ключ проверялся последний раз

    AiLocalStatus:
      type: object
      additionalProperties: false
      description: Состояние локальной модели (Ollama или OpenAI-совместимый сервер)
      required:
        - baseUrl
        - model
        - suggestions
        - server
        - api
        - resolvedBaseUrl
        - models
        - modelInstalled
        - status
        - statusText
        - detail
        - canPull
        - installHint
      properties:
        baseUrl:
          type: string
          description: Base URL из настроек
        model:
          type: string
          description: Нужная модель (по умолчанию русская t-tech/T-lite-it-2.1:q4_K_M)
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/AiLocalModelOption"
        server:
          type: string
          enum: [up, down, unknown]
        api:
          type: string
          description: '"ollama" — нативный API, "openai" — /v1, "" — сервер не найден'
        resolvedBaseUrl:
          type: string
          description: Фактически найденный адрес сервера
        models:
          type: array
          items:
            type: string
        modelInstalled:
          type: boolean
        status:
          type: string
          enum: [available, model-missing, server-down]
        statusText:
          type: string
        detail:
          type: string
        canPull:
          type: boolean
          description: Доступна ли кнопка «Скачать модель» (только Ollama)
        installHint:
          allOf:
            - $ref: "#/components/schemas/AiInstallHint"
          nullable: true

    AiSettingsUpdate:
      type: object
      additionalProperties: false
      description: Частичное обновление настроек ИИ (без ключа)
      minProperties: 1
      properties:
        mode:
          type: string
          enum: [auto, cloud, local]
        cloudProvider:
          type: string
          enum: [openai, deepseek, openrouter, groq, custom]
        cloudBaseUrl:
          type: string
        cloudModel:
          type: string
        localBaseUrl:
          type: string
        localModel:
          type: string

    AiKeyRequest:
      type: object
      additionalProperties: false
      description: Ключ проверяется рабочим запросом и сохраняется в config/ai.json
      required: [apiKey]
      properties:
        apiKey:
          type: string
          description: Секрет; в лог и в ответы не попадает
        cloudProvider:
          type: string
          enum: [openai, deepseek, openrouter, groq, custom]
        cloudBaseUrl:
          type: string
        cloudModel:
          type: string
        validate:
          type: boolean
          description: false — сохранить без проверки (по умолчанию true)

    AiKeyTestRequest:
      type: object
      additionalProperties: false
      description: Проверка ключа без сохранения (apiKey не задан → проверяется сохранённый)
      properties:
        apiKey:
          type: string
        cloudProvider:
          type: string
          enum: [openai, deepseek, openrouter, groq, custom]
        cloudBaseUrl:
          type: string
        cloudModel:
          type: string

    AiKeyTestResult:
      type: object
      additionalProperties: false
      required: [ok, message, models, checkedWith, keyMask]
      properties:
        ok:
          type: boolean
        message:
          type: string
        models:
          type: array
          items:
            type: string
        checkedWith:
          type: string
          enum: [models, chat]
        keyMask:
          type: string

    AiLocalTestRequest:
      type: object
      additionalProperties: false
      properties:
        localBaseUrl:
          type: string
        localModel:
          type: string

    AiLocalTestResult:
      type: object
      additionalProperties: false
      required: [ok, message, server, models]
      properties:
        ok:
          type: boolean
        message:
          type: string
        server:
          type: string
          enum: [up, down]
        models:
          type: array
          items:
            type: string

    AiStatus:
      type: object
      additionalProperties: false
      description: >
        Состояние подключения ИИ: показывается на входе в панель
        («Подключено: облачная модель» / «Подключите API-ключ или
        используйте локальную модель»)
      required:
        - mode
        - activeProvider
        - ready
        - summary
        - message
        - cloud
        - local
        - presets
        - settingsPath
      properties:
        mode:
          type: string
          enum: [auto, cloud, local]
        activeProvider:
          type: string
          enum: [cloud, local, none]
        ready:
          type: boolean
          description: Есть рабочий провайдер — чат ответит
        summary:
          type: string
        message:
          type: string
        cloud:
          $ref: "#/components/schemas/AiCloudStatus"
        local:
          $ref: "#/components/schemas/AiLocalStatus"
        presets:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AiProviderPreset"
        settingsPath:
          type: string
          description: Путь к файлу настроек ИИ (config/ai.json)

    AiPullEvent:
      description: >
        SSE-события загрузки локальной модели: `event: progress`
        c `{percent, completed, total, detail}` (повторяется),
        `event: done` c `{model}`, `event: error` c объектом Error.
      oneOf:
        - type: object
          required: [event, data]
          properties:
            event:
              type: string
              enum: [progress, done, error]
            data:
              type: object
