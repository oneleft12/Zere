openapi: 3.0.3

info:
  title: JARVIS Local Panel API
  description: >
    Единый API-контракт локальной панели JARVIS для обеих реализаций
    (C# и Python). Этап 1 «API-ядро» (docs/GUI_DEVELOPMENT_PLAN.md §6).

    Правила контракта:
    - сервер слушает только 127.0.0.1 (loopback);
    - все запросы требуют заголовок `X-JARVIS-Token`
      (токен лежит в `config/panel.token`, создаётся при первом старте);
    - заголовок `Host` должен быть `127.0.0.1` или `localhost`;
    - заголовок `Origin`, если присутствует, должен принадлежать
      тому же origin — иначе 403;
    - ошибки нормализованы: `{code, message}` без сырых исключений
      и внутренних путей.
  version: 1.0.0

servers:
  - url: http://127.0.0.1:8080
    description: Локальная панель (loopback only)

security:
  - tokenHeader: []

paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Статус сервисов ассистента
      tags: [system]
      responses:
        "200":
          description: Текущие статусы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/config:
    get:
      operationId: getConfig
      summary: Читаемая конфигурация (единая схема C#/Python)
      tags: [config]
      responses:
        "200":
          description: Текущая конфигурация
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: setConfig
      summary: Валидация и атомарное сохранение конфигурации
      tags: [config]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Config"
      responses:
        "200":
          description: Сохранённая конфигурация
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
        "400":
          description: >
            Ошибка валидации: неизвестный ключ или неверный тип значения.
            Тело — нормализованная ошибка.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/chat/stream:
    get:
      operationId: streamChat
      summary: Диалог с ассистентом потоком (SSE)
      description: >
        Односторонний поток ассистента: события `token` (фрагменты ответа),
        затем `done` с полным ответом, либо `error` с нормализованной
        ошибкой. Ответ формируется через штатный конвейер обработчиков
        (handlers pipeline), LLM — fallback.
      tags: [chat]
      parameters:
        - name: text
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 4000
          description: Реплика пользователя
      responses:
        "200":
          description: SSE-поток
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ChatEvent"
        "400":
          description: Пустой или слишком длинный текст
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/personality:
    get:
      operationId: getPersonality
      summary: Активная личность и фактический список стилей
      description: >
        Только фактические стили из API (этап 2: карточки стилей без
        хардкода — урок «6 стилей → 5» из отчёта анализа).
      tags: [personality]
      responses:
        "200":
          description: Текущая личность и стили
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Personality"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/NotReady"

  /api/personality/set:
    post:
      operationId: setPersonalityStyle
      summary: Смена стиля с сохранением (переживает рестарт — чинит P1-3)
      tags: [personality]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StyleSetRequest"
      responses:
        "200":
          description: Обновлённая личность
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Personality"
        "400":
          description: Неизвестный стиль, битое тело или неверный тип
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/NotReady"

  /api/history:
    get:
      operationId: getHistory
      summary: Страница истории диалогов (новые сверху)
      tags: [history]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
          description: >
            Регистронезависимая подстрока по вопросу и ответу;
            пусто — вся история.
      responses:
        "200":
          description: Страница истории и общее число записей
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryPage"
        "400":
          description: Некорректные limit/offset/search
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/NotReady"
    delete:
      operationId: clearHistory
      summary: Очистка истории — только с явным подтверждением
      description: >
        Необратимое действие: тело обязано быть {confirm: "DELETE"}
        (см. P0-3 — строгие подтверждения).
      tags: [history]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HistoryDeleteRequest"
      responses:
        "200":
          description: Число удалённых записей
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryDeleteResponse"
        "400":
          description: Нет подтверждения или неверное тело
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/NotReady"

  /api/memory:
    get:
      operationId: getMemory
      summary: Все записи памяти или поиск по ним
      tags: [memory]
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Подстрока для поиска по ключу и значению; пусто — все записи
      responses:
        "200":
          description: Записи памяти
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createMemory
      summary: Создать или обновить запись памяти (upsert по ключу)
      tags: [memory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryCreateRequest"
      responses:
        "200":
          description: Сохранённая запись
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryItem"
        "400":
          description: Некорректное тело записи
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/NotReady"

  /api/memory/{id}:
    delete:
      operationId: deleteMemory
      summary: Удалить запись памяти по идентификатору
      tags: [memory]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Запись удалена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryDeleteResponse"
        "400":
          description: Идентификатор не число
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Запись не найдена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/processes:
    get:
      operationId: listProcesses
      summary: Список процессов (подстрочный поиск по имени — параметр q)
      tags: [processes]
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Процессы, отсортированные по памяти (по убыванию)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessList"
        "400":
          description: Параметр q длиннее 100 символов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/NotReady"

  /api/processes/{pid}/kill:
    post:
      operationId: killProcess
      summary: >
        Завершить процесс. Шаг 1 (тело {}) — сервер выдаёт ttlToken на 60 с;
        шаг 2 — {confirm: "KILL", ttlToken}. TTL проверяется на сервере,
        защищённые системные процессы не завершаются (400 PROTECTED).
      tags: [processes]
      parameters:
        - name: pid
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  maxProperties: 0
                  description: Шаг 1 — запрос одноразового токена подтверждения
                - $ref: "#/components/schemas/KillConfirm"
      responses:
        "200":
          description: >
            pending (status, pid, name, ttlToken, expiresInSeconds) на шаге 1
            или killed (status, pid, name) на шаге 2
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/KillPending"
                  - $ref: "#/components/schemas/KillResult"
        "400":
          description: >
            VALIDATION_ERROR (тело/подтверждение), PROTECTED (системный
            процесс) или TTL_EXPIRED (токен истёк, погашен или от чужого действия)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Маршрут не найден или процесс уже завершён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/NotReady"

  /api/power/{action}:
    post:
      operationId: requestPower
      summary: >
        Питание (shutdown/restart/sleep). Шаг 1 (тело {}) — действие ставится
        в очередь SafeActionManager и выдаётся ttlToken; шаг 2 —
        {confirm: "POWER", ttlToken}: двойной TTL (панель + SafeActionManager)
      tags: [processes]
      parameters:
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [shutdown, restart, sleep]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  maxProperties: 0
                  description: Шаг 1 — запрос одноразового токена подтверждения
                - $ref: "#/components/schemas/PowerConfirm"
      responses:
        "200":
          description: pending (status, action, ttlToken, expiresInSeconds) или итог executed/failed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PowerPending"
                  - $ref: "#/components/schemas/PowerResult"
        "400":
          description: VALIDATION_ERROR (тело/подтверждение) или TTL_EXPIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Неизвестное действие питания
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/NotReady"

components:
  securitySchemes:
    tokenHeader:
      type: apiKey
      in: header
      name: X-JARVIS-Token
      description: >
        Токен панели, 32 байта в hex, создаётся при первом старте
        и сохраняется в `config/panel.token`.

  responses:
    Unauthorized:
      description: Отсутствует или неверен X-JARVIS-Token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Недопустимый Host или Origin (защита от DNS-rebinding/CSRF)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotReady:
      description: >
        Хранилище (личности, история, память), настройки или сервис
        (процессы, питание) ещё не готовы
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          description: Машиночитаемый код (UNAUTHORIZED, FORBIDDEN_HOST, ...)
        message:
          type: string
          description: Понятное сообщение без сырых исключений и путей

    Health:
      type: object
      required: [ollama, whisper, tts, memory, version, branch]
      additionalProperties: false
      properties:
        ollama:
          type: string
          enum: [ok, down]
        whisper:
          type: string
          enum: [ok, missing]
        tts:
          type: object
          required: [engine, status]
          additionalProperties: false
          properties:
            engine:
              type: string
              enum: [pocket, piper]
            status:
              type: string
              enum: [configured]
              description: >
                Этап 1: движок из конфигурации. Прямой пробинг TTS-сервера
                появится позже (этап 4).
        memory:
          type: object
          required: [count]
          additionalProperties: false
          properties:
            count:
              type: integer
              minimum: 0
        version:
          type: string
        branch:
          type: string
          description: Ветка git (из .git/HEAD) или "unknown"

    Config:
      type: object
      required:
        - version
        - assistantName
        - language
        - model
        - voiceEnabled
        - voiceVolume
        - autoMemory
        - ollamaTimeoutMinutes
        - ttsEngine
        - voiceReferencePath
      additionalProperties: false
      properties:
        version:
          type: string
        assistantName:
          type: string
        language:
          type: string
          enum: [ru, en]
        model:
          type: string
          description: Имя модели Ollama (например qwen3.5:2b)
        voiceEnabled:
          type: boolean
        voiceVolume:
          type: number
          minimum: 0
          maximum: 1
        autoMemory:
          type: boolean
        ollamaTimeoutMinutes:
          type: integer
          minimum: 1
          maximum: 120
        ttsEngine:
          type: string
          enum: [pocket, piper]
        voiceReferencePath:
          type: string
          description: Путь к WAV-референсу голоса, пусто = встроенный голос

    Personality:
      type: object
      required: [activeId, activeStyle, styles]
      additionalProperties: false
      properties:
        activeId:
          type: string
          description: Идентификатор активного плагина личности
        activeStyle:
          type: string
          description: Текущий стиль (например Friendly)
        styles:
          type: array
          description: Фактический список доступных стилей (без хардкода)
          items:
            type: string

    StyleSetRequest:
      type: object
      required: [styleId]
      additionalProperties: false
      properties:
        styleId:
          type: string
          description: Идентификатор стиля из Personality.styles

    HistoryPage:
      type: object
      required: [items, total]
      additionalProperties: false
      properties:
        items:
          type: array
          description: Страница истории, новые сверху
          items:
            $ref: "#/components/schemas/HistoryItem"
        total:
          type: integer
          minimum: 0
          description: Всего записей (для пагинации)

    HistoryItem:
      type: object
      required: [id, userMessage, jarvisResponse, timestamp]
      additionalProperties: false
      properties:
        id:
          type: integer
        userMessage:
          type: string
        jarvisResponse:
          type: string
        timestamp:
          type: string
          format: date-time

    HistoryDeleteRequest:
      type: object
      required: [confirm]
      additionalProperties: false
      properties:
        confirm:
          type: string
          enum: [DELETE]

    HistoryDeleteResponse:
      type: object
      required: [deleted]
      additionalProperties: false
      properties:
        deleted:
          type: integer
          minimum: 0
          description: Число удалённых записей

    MemoryList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MemoryItem"

    MemoryItem:
      type: object
      required: [id, key, value, category, createdAt]
      additionalProperties: false
      properties:
        id:
          type: integer
        key:
          type: string
        value:
          type: string
        category:
          type: string
        createdAt:
          type: string
          format: date-time

    MemoryCreateRequest:
      type: object
      required: [key, value]
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 200
        value:
          type: string
          maxLength: 2000
        category:
          type: string
          minLength: 1
          maxLength: 100
          description: По умолчанию "User"

    MemoryDeleteResponse:
      type: object
      required: [deleted]
      additionalProperties: false
      properties:
        deleted:
          type: boolean

    ProcessInfo:
      type: object
      required: [pid, name, memoryMb, responding, protected]
      additionalProperties: false
      properties:
        pid:
          type: integer
          format: int32
          minimum: 1
        name:
          type: string
        memoryMb:
          type: number
          description: Используемая память, МБ (округление сервиса процессов)
        responding:
          type: boolean
        protected:
          type: boolean
          description: Системный процесс — завершение запрещено (400 PROTECTED)
      # CPU намеренно не отдаётся: ни C#, ни Python-сервис процессов его
      # не измеряют — панель не показывает данные, которых нет.

    ProcessList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProcessInfo"

    KillConfirm:
      type: object
      required: [confirm, ttlToken]
      additionalProperties: false
      properties:
        confirm:
          type: string
          enum: [KILL]
        ttlToken:
          type: string
          pattern: "^[0-9a-f]{32}$"
          description: Токен, выданный шагом 1; одноразовый, срок 60 с

    KillPending:
      type: object
      required: [status, pid, name, ttlToken, expiresInSeconds]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [pending]
        pid:
          type: integer
          format: int32
        name:
          type: string
        ttlToken:
          type: string
          pattern: "^[0-9a-f]{32}$"
        expiresInSeconds:
          type: integer
          enum: [60]

    KillResult:
      type: object
      required: [status, pid, name]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [killed]
        pid:
          type: integer
          format: int32
        name:
          type: string

    PowerConfirm:
      type: object
      required: [confirm, ttlToken]
      additionalProperties: false
      properties:
        confirm:
          type: string
          enum: [POWER]
        ttlToken:
          type: string
          pattern: "^[0-9a-f]{32}$"

    PowerPending:
      type: object
      required: [status, action, ttlToken, expiresInSeconds]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [pending]
        action:
          type: string
          enum: [shutdown, restart, sleep]
        ttlToken:
          type: string
          pattern: "^[0-9a-f]{32}$"
        expiresInSeconds:
          type: integer
          enum: [60]

    PowerResult:
      type: object
      required: [status, action]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [executed, failed]
        action:
          type: string
          enum: [shutdown, restart, sleep]

    ChatEvent:
      description: >
        SSE-события: `event: token` c `{"text": "..."}` (может повторяться),
        `event: done` c `{"answer": "..."}` (финал), `event: error`
        c объектом Error (нормализованная ошибка, поток завершается).
      oneOf:
        - type: object
          required: [event, data]
          properties:
            event:
              type: string
              enum: [token, done, error]
            data:
              type: object
