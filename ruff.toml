# Линтер ZERE: только правила, которые ловят дефекты исполнения, а не стиль.
#
# F    — pyflakes: неопределённые имена (NameError), неиспользуемые импорты и
#        переменные, повторяющиеся ключи словаря, f-строки без подстановок;
# E9   — ошибки синтаксиса/парсинга;
# B023 — замыкание над переменной цикла (в потоке это классический дефект
#        «все обработчики видят последнюю итерацию»).
#
# Стилевые семейства (E1/E2/E5, D, N, I) сознательно не включены: 30 тыс.
# строк писались без автоформаттера, и включение стиля сейчас дало бы сотни
# замечаний, не влияющих на работу. Когда появится отдельный проход
# форматирования — правила можно добавить сюда.
target-version = "py312"
line-length = 100

exclude = [
    ".venv",
    ".git",
    "node_modules",
    "publish",
    "backups",
    "data",
    "drawings",
    "installer/Output",
    "tools/xVibePocketTTS",
]

[lint]
select = ["F", "E9", "B023"]
